name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skill size and private names
        run: bin/check-docs --base "origin/${GITHUB_BASE_REF:-main}"
      - name: Unit tests
        run: |
          for test in bin/test-*; do
            echo "== $test"
            "$test"
          done
